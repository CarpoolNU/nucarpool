# Dependabot configuration.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Version updates begin automatically once this file is on the default branch.
# Vulnerability-driven security updates additionally require "Dependabot alerts"
# and "Dependabot security updates" to be turned on under
# Settings -> Code security. Those toggles are repository settings and cannot be
# enabled from this file.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm ecosystem — package.json and yarn.lock at the repository root.
  # Yarn Classic is the package manager; the "npm" ecosystem covers it.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Let a release age on the registry before adopting it, so publishes that
    # are yanked or found to be compromised have time to be withdrawn.
    cooldown:
      default-days: 7
    # Version ceilings, applied before grouping — a package listed here is
    # filtered out of its group's pull request rather than pinning the group.
    #
    # Prisma is held at v4. Without a ceiling the `prisma` group
    # proposes 4.x -> 7.x in one pull request: three majors, and a migration
    # project rather than a dependency bump. The group is kept below so the two
    # packages still move together whenever the pin is lifted.
    #
    # 4.16.2 is the final 4.x release, so nothing further will be offered in
    # practice. Scoping to majors rather than ignoring Prisma outright states
    # the intent — "stay on this major" — and would still admit a backported
    # 4.x patch if one ever shipped.
    #
    # Caveat: `ignore` suppresses security pull requests too. Because v4 is end
    # of life, a Prisma advisory would only ever be fixed in v5+, so no
    # automated PR will appear for one. Alerts still surface in the Security
    # tab; acting on one means deliberately lifting this pin.
    ignore:
      - dependency-name: "prisma"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@prisma/client"
        update-types:
          - "version-update:semver-major"
    groups:
      # These packages are coupled and have to move together — bumping one
      # without its siblings breaks the build, so these groups deliberately
      # include major versions as well.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      # Prisma is the exception to the "majors included" note above: the ignore
      # rule holds it at v4, so this group only ever carries 4.x updates until
      # that pin is lifted.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      trpc:
        patterns:
          - "@trpc/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      antd:
        patterns:
          - "antd"
          - "rc-*"
      chart:
        patterns:
          - "chart.js"
          - "chartjs-*"
          - "react-chartjs-2"

      # Everything else: minor and patch updates batch into two pull requests.
      # Majors are left out of these groups on purpose, so each one arrives as
      # its own pull request that can be reviewed and tested individually.
      production-minor-and-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions used by the workflows in .github/workflows.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
