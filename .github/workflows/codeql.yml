# CodeQL static analysis.
#
# Generated by GitHub's CodeQL Advanced setup and then trimmed to this
# repository. The generated file carries branches for languages and build modes
# that do not exist here; what was removed, and why, is recorded in the comments
# below rather than left behind as commented-out examples, so this file
# describes the analysis that actually runs.
#
# The workflow name and the job name are load-bearing. "CodeQL Advanced" and
# "Analyze (<language>)" are the names the code-scanning checks report under,
# and whether branch protection requires them cannot be verified from this
# account - see "Git and GitHub" in CLAUDE.md. Renaming a required check
# silently un-gates it, so neither name should be tidied.
name: "CodeQL Advanced"

# Trigger policy, and it differs from the other workflows here deliberately.
#
# lint / tsc / test / build / env-contract / schema / format run on
# `pull_request` plus pushes to `main`. This one adds a weekly schedule,
# because CodeQL's value is not fixed at the moment code is written: the query
# packs are updated continuously, so a re-scan finds new classes of problem in
# code that has not changed. `staging` is listed because it is a real
# long-lived branch (`origin/staging`), not merely a name in the docs.
on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]
  schedule:
    - cron: "27 10 * * 3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    # Every language below is interpreted and analysed with `build-mode: none`,
    # so nothing is compiled and no language needs a runner of its own. The
    # generated file selected `macos-latest` when the language was `swift`;
    # there is no Swift in this repository and Swift is not in the matrix, so
    # that expression could never evaluate to anything but `ubuntu-latest`.
    runs-on: ubuntu-latest

    # The minimum CodeQL requires. Every scope not listed becomes `none`.
    permissions:
      # Uploading the results is the only write this job performs.
      security-events: write
      # Fetching CodeQL query packs.
      packages: read
      # These two are only required while the repository is private. Kept
      # because they are read-only and because dropping them would make going
      # private a silent analysis failure rather than an obvious one.
      actions: read
      contents: read

    strategy:
      # One language failing should not stop the others being analysed.
      fail-fast: false
      matrix:
        include:
          # Nine workflow files, one of which - `auto-comment.yml` - holds
          # `pull-requests: write` and interpolates a pull request author's
          # login into a comment body. Nothing here currently interpolates
          # `github.event.*` into a `run:` block, which is the injection this
          # pack is best at finding, so this language is here to keep it that
          # way in a repository whose workflows are edited often.
          - language: actions
            build-mode: none
          # The application: 236 TypeScript files and 12 JavaScript.
          - language: javascript-typescript
            build-mode: none
          # `scripts/emailtemplate.py` - 169 lines, and the only Python here.
          # It is not incidental, generated or vendored: it creates the SES
          # templates the app sends, reads AWS credentials out of the
          # environment, and composes HTML from user-controlled values, and it
          # was last changed by SCRUM-360. One file is a thin reason to run a
          # language; that file is the wrong one to stop scanning.
          - language: python
            build-mode: none

    steps:
      # Pinned to the same patch version every other workflow here that checks
      # out uses. The generator emits a floating `@v7`, which would be a second
      # convention in one repository and lets the action that runs change
      # without a commit. Dependabot tracks the `github-actions` ecosystem
      # weekly and moves these pins.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # No setup step, and none is needed: `build-mode: none` has CodeQL read
      # the source without building it, so no compiler, toolchain or
      # `actions/setup-node` is involved. The generated file's commented-out
      # setup example applied only to manual builds.
      #
      # `github/codeql-action` is left on its major tag rather than pinned to a
      # patch like the actions above. GitHub advances that tag to ship new
      # CodeQL bundles, and the exact current patch could not be confirmed
      # while writing this, so pinning it would have been a guess that breaks
      # the workflow if wrong.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The default query suite. `security-extended` is not enabled here: it
      # adds lower-precision queries, and the useful first question is whether
      # the default suite is clean on this repository. Revisit once it is.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
