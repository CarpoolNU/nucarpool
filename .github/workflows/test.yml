name: Tests

# Trigger policy, shared by lint / tsc / test / build / env-contract:
#   pull_request     - gates every PR before it can merge into main
#   push to main     - catches anything that reaches main by another route
# Deliberately not `on: [push]`: while a PR is open that runs every check twice,
# once for the branch push and once for the pull_request event.
on:
  pull_request:
  push:
    branches: [main]

# `GITHUB_TOKEN` is scoped in the file rather than left to a repository setting.
# Every scope not listed becomes `none`, and `contents: read` is all
# `actions/checkout` needs - nothing here writes to the repository, comments, or
# calls the API. `auto-comment.yml` is the one workflow that needs more, and
# declares it on its own job.
permissions:
  contents: read

# One run per ref, and a superseded run is cancelled.
#
# `github.ref` is `refs/pull/N/merge` for a `pull_request` and `refs/heads/main`
# for a push, so two pushes to an open PR share a group and the older run is
# cancelled. A push to `main` is keyed on its own SHA, which is unique per merge:
# grouping those by ref would leave each merge run queued behind the previous
# one, and a merge run should never be cancelled or delayed by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # No --passWithNoTests: an empty run should fail rather than pass silently.
      - run: yarn test
      # The same suite again, in a zone that is not UTC.
      #
      # `jest.shared.config.js` pins TZ so a run is reproducible, which also means
      # a single run can only ever prove one zone. `minutesApart` was wrong in
      # exactly the gap between two of them - correct on a developer's
      # `America/New_York` machine, wrong on this runner - so the property worth
      # checking is that the suite gives the same answers in both.
      #
      # Two steps in one job rather than a build matrix: a matrix would rename
      # this check to `test (UTC)` and `test (America/New_York)`, and whether
      # branch protection requires the name `test` cannot currently be verified
      # from this account. Renaming a required check is not worth the risk of
      # silently un-gating it.
      - run: yarn test
        env:
          NUCARPOOL_TEST_TZ: America/New_York
      # A third zone, and the first one *east* of UTC.
      #
      # The two legs above are both at or behind UTC, which leaves the entire
      # positive-offset direction unexercised - and that is the direction the
      # month-picker defect lived in. `dateUtils.ts` records it: the antd picker
      # hands back local midnight on the first of the month, these are `@db.Date`
      # columns, and east of UTC that instant's UTC day is the *previous month*,
      # so a Berlin user choosing a January-June co-op had December-May stored.
      # `dateUtils.test.ts` says so in as many words - "a positive offset is the
      # broken direction and is not among them" - because a zone cannot be
      # simulated from inside a test: V8 caches it per isolate, which is why
      # `jest.shared.config.js` pins it before the workers fork and why
      # `NUCARPOOL_TEST_TZ` is the only way to exercise a second one.
      #
      # `Asia/Kolkata` rather than `Europe/Berlin`, though the defect is written
      # up against Berlin and the suite passes in both. Kolkata is +05:30 all
      # year: it has the positive offset the property needs, it adds a
      # *non-integer* offset - a whole class of arithmetic that no other leg
      # touches - and having no DST it means the same thing in January as in
      # July, so this leg cannot start failing because of the date it ran on.
      - run: yarn test
        env:
          NUCARPOOL_TEST_TZ: Asia/Kolkata
