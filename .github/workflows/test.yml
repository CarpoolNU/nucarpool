name: Tests

# Trigger policy, shared by lint / tsc / test / build / env-contract (SCRUM-248):
#   pull_request     - gates every PR before it can merge into main
#   push to main     - catches anything that reaches main by another route
# Deliberately not `on: [push]`: while a PR is open that runs every check twice,
# once for the branch push and once for the pull_request event.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # --passWithNoTests was dropped with SCRUM-212, which added the first test
      # files. An empty run should now fail rather than pass silently. Broader
      # end-to-end coverage is still SCRUM-211.
      - run: yarn test
      # The same suite again, in a zone that is not UTC (SCRUM-297).
      #
      # `jest.config.js` pins TZ so that a run is reproducible, which also means
      # a single run can only ever prove one zone. `minutesApart` was wrong in
      # exactly the gap between two of them - correct on a developer's
      # `America/New_York` machine, wrong on this runner - so the property worth
      # checking is that the suite gives the same answers in both.
      #
      # Two steps in one job rather than a build matrix: a matrix would rename
      # this check to `test (UTC)` and `test (America/New_York)`, and whether
      # branch protection requires the name `test` cannot currently be verified
      # from this account. Renaming a required check is not worth the risk of
      # silently un-gating it.
      - run: yarn test
        env:
          NUCARPOOL_TEST_TZ: America/New_York
