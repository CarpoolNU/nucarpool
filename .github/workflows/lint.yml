name: Lint

# Trigger policy, shared by lint / tsc / test / build / env-contract (SCRUM-248):
#   pull_request     - gates every PR before it can merge into main
#   push to main     - catches anything that reaches main by another route
# Deliberately not `on: [push]`: while a PR is open that runs every check twice,
# once for the branch push and once for the pull_request event.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The `lint` script pins --max-warnings=0. Several rules that matter here,
      # notably react-hooks/exhaustive-deps, are warnings rather than errors, and
      # without that flag they would never fail this check.
      - run: yarn lint
