name: Build

# Trigger policy, shared by lint / tsc / test / build / env-contract:
#   pull_request     - gates every PR before it can merge into main
#   push to main     - catches anything that reaches main by another route
# Deliberately not `on: [push]`: while a PR is open that runs every check twice,
# once for the branch push and once for the pull_request event.
on:
  pull_request:
  push:
    branches: [main]

# `GITHUB_TOKEN` is scoped in the file rather than left to a repository setting.
# Every scope not listed becomes `none`, and `contents: read` is all
# `actions/checkout` needs - nothing here writes to the repository, comments, or
# calls the API. `auto-comment.yml` is the one workflow that needs more, and
# declares it on its own job.
permissions:
  contents: read

# One run per ref, and a superseded run is cancelled.
#
# `github.ref` is `refs/pull/N/merge` for a `pull_request` and `refs/heads/main`
# for a push, so two pushes to an open PR share a group and the older run is
# cancelled. A push to `main` is keyed on its own SHA, which is unique per merge:
# grouping those by ref would leave each merge run queued behind the previous
# one, and a merge run should never be cancelled or delayed by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # `yarn build` is bare `next build` and does not generate the Prisma
      # client. @prisma/client's postinstall normally generates it during
      # install, but making it explicit means the build no longer depends on an
      # install side effect that `--ignore-scripts` would silently remove.
      - name: generate prisma client
        run: yarn prisma generate
      # `next build` imports src/utils/env/{browser,server}.ts, which validate
      # with envsafe at import time, so every required variable must be present
      # or the build fails while collecting page data. These are throwaway
      # placeholders derived from the env contract itself - building the app
      # never requires real credentials or a reachable database.
      - name: provide placeholder build environment
        run: node scripts/check-env-contract.js --github-env >> "$GITHUB_ENV"
      # Bare `next build`. Deliberately not one of the `build:*` scripts: those
      # are the deploy surface (amplify.yml selects one via BUILD_ENV) and run
      # `prisma generate` themselves, which the explicit step above already did.
      - run: yarn build
      # Under the Pages Router a filename is a URL, so a co-located
      # `*.test.ts` is compiled and shipped as an endpoint. Nothing else here
      # notices: `next build` compiles it happily and the `test` job reads
      # source, never the route table. Checked against the real manifest this
      # build just produced rather than inferred from filenames.
      - name: assert no test file was compiled into a route
        run: node scripts/check-page-routes.js --manifest
