# AWS Amplify Hosting build spec.
#
# A file at this path takes precedence over the build settings in the Amplify
# console, so this is the authoritative definition of how the app is built and
# what is deployed.
#
# `BUILD_ENV` selects the package.json script (`build:development` or
# `build:production`) and is set per branch in the console.
#
# The `env | grep` lines write the container's environment into
# .env.production, which is what gives the *runtime* its configuration - a
# variable set in the Amplify console reaches the build shell for free, but
# only reaches the deployed server if it is copied here.
#
# No secret value appears in this file: the patterns are variable-name
# fragments. Note though that grep sees whole `NAME=value` lines, so a pattern
# also matches a variable whose *value* happens to contain one of these words,
# and that variable is then copied into .env.production too. Harmless in
# practice - .env.production is gitignored and never leaves the container - and
# left alone deliberately, because the obvious tightening (anchoring with `^`)
# would silently *reduce* coverage: `SECRET_ACCESS_KEY_AWS` is matched by
# `ACCESS` in the middle of the name, not at the start, and so are two others.
#
# ---------------------------------------------------------------------------
# Exit codes: why one of these lines ends in `|| true`
#
# `grep` exits **1** when nothing matches, and Amplify fails the build on any
# non-zero exit from a build command. So a pattern matching no variable in the
# container does not produce an empty append - it stops the deploy, before
# `next build` has run, with nothing in the log but "Command failed with exit
# code 1" under the offending pattern.
#
# That is the right outcome for a pattern covering a variable the app requires,
# and it is redundant there anyway: console variables reach the build shell, and
# `next build` imports the envsafe modules, so a missing required variable
# already fails the build with a message naming it. These lines exist to
# propagate values to the *runtime*, not to validate them.
#
# It is the wrong outcome for a family that is legitimately absent. Two
# variables are optional - `S3_BUCKET_NAME` and `S3_REGION`, which default in
# `server.ts` - and `S3_` is the only pattern covering the first of them, so
# that one line tolerates a no-match and no other line does.
#
# `NEXTAUTH_URL` is the one to be careful with: it matches no variable in the
# envsafe contract, so its strict `grep` is the *only* thing that would notice
# the variable disappearing from the console. Leave it strict.
#
# **All of that is now checked, not just documented**.
# `check-env-contract.js --amplify` classifies each variable by whether its
# envsafe validator carries a `default:`, and then requires each command's
# strictness to match what it covers:
#
#   - covers a required variable  -> must be strict
#   - covers only optional ones   -> must be tolerant
#   - covers nothing in the contract -> unconstrained (`NEXTAUTH_URL`)
#
# So do not make a line tolerant to get a red build green: if the pattern
# covers a required variable the check will reject it, and the missing value is
# the bug. Adding a variable with a code default no longer installs a tripwire
# either - the check will tell you the command needs `|| true`.
# ---------------------------------------------------------------------------
#
# **`node scripts/check-env-contract.js --amplify` checks these patterns
# against the app's real environment contract** and the `env-contract` CI job
# runs it, so a newly required variable can no longer be missing here, and
# a command's strictness has to match what it covers. Before
# that existed, `S3_BUCKET_NAME` was: treated as required by that check, absent
# from every pattern, and carrying a code default, so the build resolved the
# console value into the CSP and `images.remotePatterns` while the runtime
# silently fell back to `carpoolnubucket`. The check derives its
# list from every `process.env.X` in the env modules, so it cannot tell a
# defaulted variable from a mandatory one - which is how the pattern it asked
# for came to be a strict one.
#
# **This block is required, not belt-and-braces, and must not be deleted.** AWS
# documents it as the supported way to do this: "a Next.js server component
# doesn't have access to those environment variables by default. This behaviour
# is intentional to protect any secrets stored in environment variables that
# your application uses during the build phase." Amplify then "allows your
# application to access these variables when the application receives traffic",
# so the file does not need to be inside `artifacts.baseDirectory` - the path is
# relative to the application root, which for a single-app repository like this
# one is the repository root. See
# https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
#
# The `NEXT_PUBLIC_` pattern is AWS's own example, and it is here rather than
# left to Next's build-time inlining on purpose. Inlining does cover the two
# `NEXT_PUBLIC_*` variables this app reads today, because both are read through
# a literal `process.env.NEXT_PUBLIC_X`. It would not cover one read through a
# computed key, and relying on that distinction meant the check below had to
# carry a prefix exemption whose correctness depended on how the env module
# happened to be written. Copying them is one line and removes the argument.
#
# **AWS warns that anyone with access to the deployment artifacts can read
# these values**, and recommends an IAM compute role instead of long-lived
# credentials for reaching AWS services. `ACCESS_KEY_ID_AWS` and
# `SECRET_ACCESS_KEY_AWS` are exactly what that warning is about, and a compute
# role would remove them rather than protect them. SCRUM-390; not changed here.
#
# Amplify Hosting's Next.js compute support covers Next.js 12 through 15.
# Bumping the framework past that fails at deploy, not at build.
#
# ---------------------------------------------------------------------------
# Build caching
#
# There was no `cache:` block here at all until now, so every deploy
# recompiled from scratch and Next.js logged "No build cache found. Please
# configure build caching for faster rebuilds". The block at the bottom is
# what AWS and the Next.js CI guide both recommend.
#
# `cache.paths` is separate from `artifacts`: it governs what is preserved
# *between* builds, not what is served. Adding it cannot change the deployed
# bundle.
#
# **This has not been proven on a real deploy, and it carries a documented
# risk.** AWS warns that Amplify's CodeBuild container compresses the cache and
# uploads it to S3, which "could cause your build to fail with an out of memory
# error". The local numbers put this app squarely in that regime: `.next/cache`
# measured 438 MB and `node_modules` 1.2 GB on 2026-08-31. If a build starts
# failing with an OOM after this landed, AWS's remedy is to drop
# `.next/cache/**/*` from the paths below and set `NODE_OPTIONS` in the console
# rather than in this file.
#
# Also still open: whether the deployed artifact is anywhere near
# Amplify's 220 MB ceiling for SSR apps. An earlier note claimed `.next/cache`
# pushed it over, but that compared `du -sh .next` against a limit that applies
# to Amplify's *transformed* `compute` + `static` output, which is a different
# and much smaller thing. Settle it with
# `aws amplify get-job --app-id <id> --branch-name <branch> --job-id <n>`,
# then `du -csh compute static` on the downloaded artifacts.
# ---------------------------------------------------------------------------
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile
        - npx prisma generate
    build:
      commands:
        - env | grep -e ACCESS >> .env.production
        - env | grep -e DATABASE >> .env.production
        - env | grep -e GOOGLE >> .env.production
        - env | grep -e NEXTAUTH_URL >> .env.production
        - env | grep -e NEXTAUTH_SECRET >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - env | grep -e REGION >> .env.production
        # The one tolerant line. `S3_BUCKET_NAME` and `S3_REGION` are
        # optional - both default in `server.ts` to the values this deployment
        # already uses - so no `S3_*` variable need exist, and `grep` exits 1
        # when none does, which failed the whole build. See "Exit codes" above
        # before copying `|| true` onto any other line here.
        - env | grep -e S3_ >> .env.production || true
        - env | grep -e SECRET >> .env.production
        - env | grep -e AZURE >> .env.production
        - env | grep -e PUSHER >> .env.production
        # Build identity, so the deployed app can say which commit it is.
        # Amplify's build container sets these three; nothing
        # else in this file carried them, so the information existed at build
        # time and was thrown away - and "has the fix shipped?" had no answer
        # short of console access. `pages/api/version.ts` serves them.
        #
        # Matched by exact name, NOT by a shared `AWS_` prefix, which would be
        # the obvious way to write this in one line. The build container also
        # holds the credentials Amplify itself runs with, and any of
        # `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY` or `AWS_SESSION_TOKEN`
        # present there would be swept into `.env.production` by a prefix
        # match - a file AWS's own documentation warns is readable by anyone
        # with access to the deployment artifacts. Three narrow patterns
        # cannot do that. Keep them narrow.
        #
        # Strict, with no `|| true`. Read "Exit codes" above before changing
        # that: these are not optional-and-absent like `S3_`, they are set by
        # Amplify on every build, so a no-match means Amplify stopped
        # providing one and the strict `grep` is the only thing that would
        # say so - the same argument that keeps `NEXTAUTH_URL` strict. They
        # are outside the `envsafe` contract, so
        # `check-env-contract.js --amplify` treats them as *unconstrained*
        # and enforces neither choice; this comment is the record of why.
        # The trade is that a deploy fails if AWS renames one. If that
        # happens, the fix is to update the name here, not to add `|| true`.
        - env | grep -e AWS_COMMIT_ID >> .env.production
        - env | grep -e AWS_BRANCH >> .env.production
        - env | grep -e AWS_JOB_ID >> .env.production
        - yarn run build:${BUILD_ENV}

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  # Preserved between builds, not deployed. Paths are relative to the build
  # root, so these are the repository's own `.next/cache` and `node_modules`
  # rather than anything under `artifacts.baseDirectory` above. See the
  # out-of-memory caveat in the header before assuming this is free.
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
